packages:
  - "apps/*"
  - "packages/*"
# 全树锁定 TypeScript 主版本：构建工具对 typescript 的 peer 约束上界敞开，
# 不加这条会被传递依赖带进 TS 7，导致类型检查静默失效。
overrides:
  typescript: 6.0.3
allowBuilds:
  '@swc/core': true
  esbuild: true
# pnpm 12 内置 minimumReleaseAge（1440 分钟）；以下条目豁免近期发布的固定版本
minimumReleaseAgeExclude:
  - '@ant-design/cli@6.6.8'
  - '@oxfmt/binding-android-arm-eabi@0.75.0'
  - '@oxfmt/binding-android-arm64@0.75.0'
  - '@oxfmt/binding-darwin-arm64@0.75.0'
  - '@oxfmt/binding-darwin-x64@0.75.0'
  - '@oxfmt/binding-freebsd-x64@0.75.0'
  - '@oxfmt/binding-linux-arm-gnueabihf@0.75.0'
  - '@oxfmt/binding-linux-arm-musleabihf@0.75.0'
  - '@oxfmt/binding-linux-arm64-gnu@0.75.0'
  - '@oxfmt/binding-linux-arm64-musl@0.75.0'
  - '@oxfmt/binding-linux-ppc64-gnu@0.75.0'
  - '@oxfmt/binding-linux-riscv64-gnu@0.75.0'
  - '@oxfmt/binding-linux-riscv64-musl@0.75.0'
  - '@oxfmt/binding-linux-s390x-gnu@0.75.0'
  - '@oxfmt/binding-linux-x64-gnu@0.75.0'
  - '@oxfmt/binding-linux-x64-musl@0.75.0'
  - '@oxfmt/binding-openharmony-arm64@0.75.0'
  - '@oxfmt/binding-win32-arm64-msvc@0.75.0'
  - '@oxfmt/binding-win32-ia32-msvc@0.75.0'
  - '@oxfmt/binding-win32-x64-msvc@0.75.0'
  - '@oxlint/binding-android-arm-eabi@1.90.0'
  - '@oxlint/binding-android-arm64@1.90.0'
  - '@oxlint/binding-darwin-arm64@1.90.0'
  - '@oxlint/binding-darwin-x64@1.90.0'
  - '@oxlint/binding-freebsd-x64@1.90.0'
  - '@oxlint/binding-linux-arm-gnueabihf@1.90.0'
  - '@oxlint/binding-linux-arm-musleabihf@1.90.0'
  - '@oxlint/binding-linux-arm64-gnu@1.90.0'
  - '@oxlint/binding-linux-arm64-musl@1.90.0'
  - '@oxlint/binding-linux-ppc64-gnu@1.90.0'
  - '@oxlint/binding-linux-riscv64-gnu@1.90.0'
  - '@oxlint/binding-linux-riscv64-musl@1.90.0'
  - '@oxlint/binding-linux-s390x-gnu@1.90.0'
  - '@oxlint/binding-linux-x64-gnu@1.90.0'
  - '@oxlint/binding-linux-x64-musl@1.90.0'
  - '@oxlint/binding-openharmony-arm64@1.90.0'
  - '@oxlint/binding-win32-arm64-msvc@1.90.0'
  - '@oxlint/binding-win32-ia32-msvc@1.90.0'
  - '@oxlint/binding-win32-x64-msvc@1.90.0'
  - oxfmt@0.75.0
  - oxlint@1.90.0
  - '@nuxt/kit@4.6.3'
  - '@nuxt/nitro-server@4.6.3'
  - '@nuxt/schema@4.6.3'
  - '@nuxt/vite-builder@4.6.3'
  - '@nuxt/vite-server@4.6.3'
  - nuxt@4.6.3
